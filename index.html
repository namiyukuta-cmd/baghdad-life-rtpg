<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ead9bd">
  <title>バグダード生活TRPG</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <p class="eyebrow">9世紀・バグダード生活型ソロTRPG</p>
        <h1>橋のたもとから</h1>
      </div>
      <button id="saveBtn" class="small-btn">保存</button>
    </header>

    <section class="card world-card">
      <div class="date-line"><strong id="dateText"></strong><span id="timeText"></span></div>
      <div id="weatherText" class="muted"></div>
      <div class="place-line">現在地：<strong id="locationText"></strong></div>
    </section>

    <section class="meters" id="meters"></section>

    <section class="card compact-card status-card">
      <div class="money-row">
        <span>所持金 <strong id="moneyText"></strong></span>
        <span>評判 <strong id="repText"></strong></span>
        <span>重量 <strong id="weightText"></strong></span>
      </div>
      <div id="abilities" class="ability-row"></div>
    </section>

    <section class="card result-card" aria-live="polite">
      <div class="section-title">直前の出来事</div>
      <div id="resultText"></div>
    </section>

    <nav class="tabbar" aria-label="ゲーム画面切り替え">
      <button class="tab active" data-panel="actionsPanel">行動</button>
      <button class="tab" data-panel="movesPanel">移動</button>
      <button class="tab" data-panel="inventoryPanel">所持品</button>
      <button class="tab" data-panel="skillsPanel">スキル</button>
      <button class="tab" data-panel="logPanel">ログ</button>
    </nav>

    <section class="panel-shell">
      <section id="actionsPanel" class="card game-panel active">
        <div id="actions" class="action-grid"></div>
      </section>

      <section id="movesPanel" class="card game-panel">
        <div id="moves" class="move-grid"></div>
      </section>

      <section id="inventoryPanel" class="card game-panel">
        <div id="inventory" class="list"></div>
      </section>

      <section id="skillsPanel" class="card game-panel">
        <div id="skills" class="list"></div>
      </section>

      <section id="logPanel" class="card game-panel">
        <div id="log" class="list log-list"></div>
        <button id="resetBtn" class="danger-link">この端末のセーブを初期状態に戻す</button>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js?v=5"></script>
  <script src="ui-patch.js?v=1"></script>
  <script>
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.game-panel');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.panel).classList.add('active');
      });
    });
  </script>
</body>
</html>
