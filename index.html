<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ead9bd">
  <title>バグダード生活TRPG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">9世紀・バグダード生活型ソロTRPG</p>
        <h1>橋のたもとから</h1>
      </div>
      <button id="saveBtn" class="small-btn">保存</button>
    </header>

    <section class="card world-card">
      <div class="date-line"><strong id="dateText"></strong><span id="timeText"></span></div>
      <div id="weatherText" class="muted"></div>
      <div class="place-line">現在地：<strong id="locationText"></strong></div>
    </section>

    <section class="meters" id="meters"></section>

    <section class="card compact-card">
      <div class="money-row">
        <span>所持金 <strong id="moneyText"></strong></span>
        <span>評判 <strong id="repText"></strong></span>
        <span>重量 <strong id="weightText"></strong></span>
      </div>
      <div id="abilities" class="ability-row"></div>
    </section>

    <section class="card result-card" aria-live="polite">
      <div class="section-title">直前の出来事</div>
      <div id="resultText">川沿いで朝を迎えている。</div>
    </section>

    <section class="card">
      <div class="section-title">行動</div>
      <div id="actions" class="action-grid"></div>
    </section>

    <section class="card">
      <div class="section-title">移動</div>
      <div id="moves" class="move-grid"></div>
    </section>

    <details class="card">
      <summary>所持品</summary>
      <div id="inventory" class="list"></div>
    </details>

    <details class="card">
      <summary>スキル</summary>
      <div id="skills" class="list"></div>
    </details>

    <details class="card">
      <summary>行動ログ</summary>
      <div id="log" class="list log-list"></div>
    </details>

    <section class="bottom-actions">
      <button id="resetBtn" class="danger-link">この端末のセーブを初期状態に戻す</button>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
